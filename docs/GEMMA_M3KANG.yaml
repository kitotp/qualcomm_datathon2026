# Reproduce the selected 200-step checkpoint. Original run stopped after dev worsened at 400.
model: models/gemma-3-1b-it-4bit
train: true
data: data/finetune-m3kang/mlx
adapter_path: models/gemma-m3kang-reproduced
seed: 42
num_layers: -1
batch_size: 4
iters: 200
learning_rate: 0.0001
max_seq_length: 512
mask_prompt: true
grad_checkpoint: true
steps_per_report: 10
steps_per_eval: 200
val_batches: -1
save_every: 200
lora_parameters:
  rank: 8
  dropout: 0.05
  scale: 16.0
